services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tenisu
      POSTGRES_USER: tenisu
      POSTGRES_PASSWORD: tenisu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenisu -d tenisu"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://tenisu:tenisu@database:5432/tenisu
      DATABASE_SSL: "false"
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
