openapi: 3.1.0
info:
  title: Tenisu API
  version: 1.0.0
  description: REST API for retrieving player statistics and managing player records.
servers:
  - url: /
    description: API on the current host (local or deployed)
paths:
  /api/statistics:
    get:
      operationId: getPlayerStatistics
      summary: Get aggregate player statistics
      description: >-
        Returns the country with the highest aggregate win ratio across its players,
        the average player BMI, and the median player height. A win is represented by
        1 in each player's recent results. Ties are resolved by country code in
        ascending alphabetical order. The win ratio is rounded to four decimal places
        and the average BMI to two decimal places. Metrics are null when no players
        are available.
      responses:
        '200':
          description: Player statistics retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                required: [statistics]
                properties:
                  statistics:
                    $ref: '#/components/schemas/PlayerStatistics'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/players:
    post:
      operationId: createPlayer
      summary: Create a player
      description: >-
        Creates a player from its complete representation. The server generates the
        player ID. A new country is created when its code is not yet
        present; the stored picture is preserved when the country already exists.
        Requires the X-API-Key header to match PLAYER_WRITE_API_KEY configured on
        the server. The configured key must be at least 32 bytes; player creation
        is disabled otherwise. In Swagger UI, use the Authorize control to provide
        the same key.
      security:
        - PlayerWriteApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPlayer'
            example:
              firstname: Coco
              lastname: Gauff
              shortname: C.GAU
              sex: F
              country:
                picture: https://example.com/usa.png
                code: USA
              picture: https://example.com/gauff.png
              data:
                rank: 3
                points: 7200
                weight: 55000
                height: 175
                age: 20
                last: [1, 1, 0, 1, 1]
      responses:
        '201':
          description: Player created successfully.
          headers:
            Location:
              description: URL of the created player resource.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                type: object
                required: [player]
                properties:
                  player:
                    $ref: '#/components/schemas/Player'
        '400':
          description: The player representation or JSON body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidPlayerRequestErrorResponse'
              examples:
                invalidPlayer:
                  value:
                    error:
                      code: INVALID_PLAYER
                      message: Request body must contain a valid player.
                invalidJson:
                  value:
                    error:
                      code: INVALID_JSON
                      message: Request body contains invalid JSON.
        '413':
          description: The request body exceeds the 100 KB limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadTooLargeErrorResponse'
              example:
                error:
                  code: PAYLOAD_TOO_LARGE
                  message: Request body exceeds the allowed size.
        '415':
          description: The request body uses an unsupported media type or JSON encoding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsupportedPlayerRequestErrorResponse'
              examples:
                unsupportedMediaType:
                  value:
                    error:
                      code: UNSUPPORTED_MEDIA_TYPE
                      message: Content-Type must be application/json.
                unsupportedJsonEncoding:
                  value:
                    error:
                      code: UNSUPPORTED_JSON_ENCODING
                      message: The request body encoding is not supported.
        '401':
          description: The write API key is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: A valid API key is required.
        '503':
          description: Player creation is disabled because no sufficiently strong write API key is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerCreationDisabledErrorResponse'
              example:
                error:
                  code: PLAYER_CREATION_DISABLED
                  message: Player creation requires a configured API key of at least 32 bytes.
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: listPlayers
      summary: List players
      description: >-
        Returns all players ordered by ranking in ascending order (rank 1 first).
        Player id is used as a deterministic tie-breaker.
      responses:
        '200':
          description: Players retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - players
                properties:
                  players:
                    type: array
                    items:
                      $ref: '#/components/schemas/Player'
              example:
                players:
                  - id: 52
                    firstname: Novak
                    lastname: Djokovic
                    shortname: N.DJO
                    sex: M
                    country:
                      picture: https://tenisu.latelier.co/resources/Serbie.png
                      code: SRB
                    picture: https://tenisu.latelier.co/resources/Djokovic.png
                    data:
                      rank: 2
                      points: 2542
                      weight: 80000
                      height: 188
                      age: 31
                      last: [1, 1, 1, 1, 1]
        '500':
          $ref: '#/components/responses/InternalServerError'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/players/{id}:
    get:
      operationId: getPlayerById
      summary: Get a player by ID
      parameters:
        - name: id
          in: path
          required: true
          description: Positive integer player ID.
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          example: 17
      responses:
        '200':
          description: Player retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                required: [player]
                properties:
                  player:
                    $ref: '#/components/schemas/Player'
        '400':
          description: The player ID is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidPlayerIdErrorResponse'
              example:
                error:
                  code: INVALID_PLAYER_ID
                  message: Player ID must be a positive integer.
        '404':
          description: No player exists with the requested ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerNotFoundErrorResponse'
              example:
                error:
                  code: PLAYER_NOT_FOUND
                  message: Player not found.
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    PlayerWriteApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        Required to create a player. Configure PLAYER_WRITE_API_KEY with a secret
        of at least 32 bytes on the server, then provide the same value here.
  schemas:
    PlayerStatistics:
      type: object
      required: [countryWithHighestWinRatio, averageBmi, medianHeightCm]
      properties:
        countryWithHighestWinRatio:
          oneOf:
            - type: object
              required: [countryCode, winRatio]
              properties:
                countryCode:
                  type: string
                  example: SRB
                winRatio:
                  type: number
                  minimum: 0
                  maximum: 1
                  description: Wins divided by all recent results for players from this country.
                  example: 0.8
            - type: "null"
        averageBmi:
          type: [number, "null"]
          minimum: 0
          description: Arithmetic mean of player BMI values, rounded to two decimal places.
          example: 23.42
        medianHeightCm:
          type: [number, "null"]
          minimum: 0
          description: Median player height in centimeters; the middle two heights are averaged when the player count is even.
          example: 185
    Player:
      type: object
      required:
        - id
        - firstname
        - lastname
        - shortname
        - sex
        - country
        - picture
        - data
      properties:
        id:
          type: integer
          minimum: 1
          maximum: 2147483647
          example: 52
        firstname:
          type: string
          minLength: 1
          maxLength: 100
          example: Novak
        lastname:
          type: string
          minLength: 1
          maxLength: 100
          example: Djokovic
        shortname:
          type: string
          minLength: 1
          maxLength: 5
          example: N.DJO
        sex:
          type: string
          enum: [M, F]
        country:
          type: object
          required: [picture, code]
          properties:
            picture:
              type: string
              format: uri
            code:
              type: string
              pattern: '^[A-Z]{3}$'
              example: SRB
        picture:
          type: string
          format: uri
        data:
          type: object
          required: [rank, points, weight, height, age, last]
          properties:
            rank:
              type: integer
              minimum: 1
              maximum: 2147483647
            points:
              type: integer
              minimum: 0
              maximum: 2147483647
            weight:
              type: integer
              description: Weight in grams, as provided by the source dataset.
              minimum: 1
              maximum: 2147483647
            height:
              type: integer
              description: Height in centimeters, as provided by the source dataset.
              minimum: 1
              maximum: 2147483647
            age:
              type: integer
              minimum: 1
              maximum: 32767
            last:
              type: array
              description: Recent match result values as provided by the source dataset.
              minItems: 5
              maxItems: 5
              items:
                type: integer
                enum: [0, 1]
    NewPlayer:
      type: object
      required: [firstname, lastname, shortname, sex, country, picture, data]
      additionalProperties: false
      properties:
        firstname:
          type: string
          minLength: 1
          maxLength: 100
        lastname:
          type: string
          minLength: 1
          maxLength: 100
        shortname:
          type: string
          minLength: 1
          maxLength: 5
        sex:
          type: string
          enum: [M, F]
        country:
          type: object
          required: [picture, code]
          additionalProperties: false
          properties:
            picture:
              type: string
              format: uri
            code:
              type: string
              pattern: '^[A-Z]{3}$'
        picture:
          type: string
          format: uri
        data:
          type: object
          required: [rank, points, weight, height, age, last]
          additionalProperties: false
          properties:
            rank:
              type: integer
              minimum: 1
              maximum: 2147483647
            points:
              type: integer
              minimum: 0
              maximum: 2147483647
            weight:
              type: integer
              minimum: 1
              maximum: 2147483647
            height:
              type: integer
              minimum: 1
              maximum: 2147483647
            age:
              type: integer
              minimum: 1
              maximum: 32767
            last:
              type: array
              minItems: 5
              maxItems: 5
              items:
                type: integer
                enum: [0, 1]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [ROUTE_NOT_FOUND, PLAYER_NOT_FOUND, INVALID_PLAYER_ID, INVALID_PLAYER, INVALID_JSON, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, UNSUPPORTED_JSON_ENCODING, UNAUTHORIZED, PLAYER_CREATION_DISABLED, INTERNAL_SERVER_ERROR]
            message:
              type: string
    InvalidPlayerRequestErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  enum: [INVALID_PLAYER, INVALID_JSON]
    PayloadTooLargeErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  enum: [PAYLOAD_TOO_LARGE]
    UnsupportedPlayerRequestErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  enum: [UNSUPPORTED_MEDIA_TYPE, UNSUPPORTED_JSON_ENCODING]
    UnauthorizedErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  enum: [UNAUTHORIZED]
    PlayerCreationDisabledErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  enum: [PLAYER_CREATION_DISABLED]
    InvalidPlayerIdErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  enum: [INVALID_PLAYER_ID]
    PlayerNotFoundErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  enum: [PLAYER_NOT_FOUND]
    RouteNotFoundErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  enum: [ROUTE_NOT_FOUND]
    InternalServerErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                  enum: [INTERNAL_SERVER_ERROR]
  responses:
    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerErrorResponse'
          example:
            error:
              code: INTERNAL_SERVER_ERROR
              message: An unexpected error occurred.
    NotFound:
      description: The requested route does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RouteNotFoundErrorResponse'
          example:
            error:
              code: ROUTE_NOT_FOUND
              message: Route not found.
